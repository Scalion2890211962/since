<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacuum Mycelium - 星际菌丝网络</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #00001a;
            font-family: 'Arial', sans-serif;
        }
        
        canvas {
            display: block;
            background: radial-gradient(circle at center, #050a29 0%, #00001a 100%);
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #a8d8ff;
            z-index: 10;
            background: rgba(0, 10, 40, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #4a80ff;
            backdrop-filter: blur(5px);
        }
        
        .info-panel h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #87ceeb;
        }
        
        .info-panel p {
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 5px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #a8d8ff;
            background: rgba(0, 10, 40, 0.7);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #4a80ff;
        }
        
        .controls button {
            background: #1a365d;
            color: #87ceeb;
            border: 1px solid #4a80ff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
            transition: all 0.3s;
        }
        
        .controls button:hover {
            background: #2c5282;
            box-shadow: 0 0 10px #4a80ff;
        }
    </style>
</head>
<body>
    <div class="info-panel">
        <h1>真空菌丝 (Vacuum Mycelium)</h1>
        <p>✦ 星际空间中蔓延的能量真菌网络</p>
        <p>✦ 以暗能量为养分，构成星际高速公路</p>
        <p>✦ 飞船可沿菌丝"滑行"实现超光速移动</p>
    </div>
    
    <div class="controls">
        <button id="growBtn">加速生长</button>
        <button id="energyBtn">能量涌动</button>
        <button id="resetBtn">重置网络</button>
    </div>

    <canvas id="myceliumCanvas"></canvas>

    <script>
        // 获取Canvas和上下文
        const canvas = document.getElementById('myceliumCanvas');
        const ctx = canvas.getContext('2d');
        
        // 设置Canvas尺寸为窗口大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 菌丝节点类
        class MyceliumNode {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 3 + 1;
                this.energy = Math.random() * 100;
                this.growthSpeed = Math.random() * 0.5 + 0.1;
                this.connections = []; // 连接的其他节点
            }
            
            // 绘制节点
            draw() {
                // 绘制节点核心
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );
                gradient.addColorStop(0, `rgba(135, 206, 235, ${0.8 + this.energy/200})`);
                gradient.addColorStop(1, `rgba(74, 128, 255, ${0.4 + this.energy/200})`);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // 绘制能量光晕
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius + this.energy/20, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(100, 181, 246, ${0.1 + this.energy/300})`;
                ctx.lineWidth = 0.5;
                ctx.stroke();
            }
            
            // 更新节点状态
            update(growthMultiplier = 1) {
                // 能量波动
                this.energy += (Math.random() - 0.5) * 2;
                this.energy = Math.max(0, Math.min(200, this.energy));
                
                // 缓慢生长
                this.radius += this.growthSpeed * growthMultiplier * 0.01;
                this.radius = Math.min(5, this.radius);
                
                // 随机微小位移（模拟能量流动）
                this.x += (Math.random() - 0.5) * 0.1;
                this.y += (Math.random() - 0.5) * 0.1;
            }
            
            // 连接到另一个节点
            connect(node) {
                if (!this.connections.includes(node) && this !== node) {
                    this.connections.push(node);
                    node.connections.push(this);
                }
            }
            
            // 绘制连接（菌丝）
            drawConnections(energyFlow = false) {
                this.connections.forEach(node => {
                    const dx = node.x - this.x;
                    const dy = node.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 只绘制合理距离内的连接
                    if (distance > 20 && distance < 300) {
                        ctx.beginPath();
                        
                        // 菌丝采用贝塞尔曲线模拟自然弯曲
                        const cpX = this.x + dx/2 + (Math.random() - 0.5) * 20;
                        const cpY = this.y + dy/2 + (Math.random() - 0.5) * 20;
                        ctx.moveTo(this.x, this.y);
                        ctx.quadraticCurveTo(cpX, cpY, node.x, node.y);
                        
                        // 能量流动效果
                        const energyLevel = (this.energy + node.energy) / 400;
                        ctx.strokeStyle = energyFlow 
                            ? `rgba(173, 232, 244, ${0.2 + energyLevel * 0.8})`
                            : `rgba(74, 128, 255, ${0.1 + energyLevel * 0.4})`;
                        
                        // 菌丝宽度随能量变化
                        ctx.lineWidth = 0.3 + energyLevel * 1.5;
                        
                        // 虚线效果模拟菌丝纹理
                        if (Math.random() > 0.7) {
                            ctx.setLineDash([5, 3]);
                        } else {
                            ctx.setLineDash([]);
                        }
                        
                        ctx.stroke();
                        ctx.setLineDash([]);
                        
                        // 绘制能量粒子
                        if (energyFlow && Math.random() > 0.7) {
                            const particleX = this.x + dx * Math.random();
                            const particleY = this.y + dy * Math.random();
                            ctx.beginPath();
                            ctx.arc(particleX, particleY, 0.5 + Math.random() * 1, 0, Math.PI * 2);
                            ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + Math.random() * 0.5})`;
                            ctx.fill();
                        }
                    }
                });
            }
        }
        
        // 初始化菌丝网络
        let nodes = [];
        let growthMultiplier = 1;
        let energyFlow = false;
        
        // 创建初始节点
        function initNodes(count = 50) {
            nodes = [];
            for (let i = 0; i < count; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                nodes.push(new MyceliumNode(x, y));
            }
            
            // 建立节点连接（模拟菌丝网络）
            nodes.forEach(node => {
                // 连接附近的节点
                nodes.forEach(otherNode => {
                    const dx = otherNode.x - node.x;
                    const dy = otherNode.y - node.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    // 距离合适且随机概率
                    if (distance > 50 && distance < 200 && Math.random() > 0.85) {
                        node.connect(otherNode);
                    }
                });
            });
        }
        
        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 半透明背景实现拖影效果
            ctx.fillStyle = 'rgba(0, 10, 40, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制星空背景
            drawStars();
            
            // 更新和绘制所有节点
            nodes.forEach(node => {
                node.update(growthMultiplier);
                node.drawConnections(energyFlow);
                node.draw();
            });
            
            // 随机生成新节点（模拟生长）
            if (Math.random() > 0.98 && nodes.length < 100) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const newNode = new MyceliumNode(x, y);
                nodes.push(newNode);
                
                // 连接到最近的节点
                let closestNode = null;
                let minDistance = Infinity;
                nodes.forEach(node => {
                    if (node === newNode) return;
                    const dx = node.x - newNode.x;
                    const dy = node.y - newNode.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < minDistance) {
                        minDistance = distance;
                        closestNode = node;
                    }
                });
                if (closestNode) newNode.connect(closestNode);
            }
            
            // 重置生长倍率
            if (growthMultiplier > 1) {
                growthMultiplier *= 0.99;
            }
            
            // 重置能量流动
            if (energyFlow && Math.random() > 0.95) {
                energyFlow = false;
            }
        }
        
        // 绘制星空背景
        function drawStars() {
            ctx.fillStyle = '#ffffff';
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 1.5;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        // 事件监听
        document.getElementById('growBtn').addEventListener('click', () => {
            growthMultiplier = 5; // 加速生长
        });
        
        document.getElementById('energyBtn').addEventListener('click', () => {
            energyFlow = true; // 开启能量流动
            // 给所有节点增加能量
            nodes.forEach(node => {
                node.energy += 100;
                node.energy = Math.min(200, node.energy);
            });
        });
        
        document.getElementById('resetBtn').addEventListener('click', () => {
            initNodes(); // 重置网络
        });
        
        // 鼠标交互：点击添加节点
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const newNode = new MyceliumNode(x, y);
            newNode.energy = 200; // 点击处节点能量最高
            nodes.push(newNode);
            
            // 连接到最近的节点
            let closestNode = null;
            let minDistance = Infinity;
            nodes.forEach(node => {
                if (node === newNode) return;
                const dx = node.x - newNode.x;
                const dy = node.y - newNode.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestNode = node;
                }
            });
            if (closestNode) newNode.connect(closestNode);
        });
        
        // 初始化并启动动画
        initNodes();
        animate();
    </script>
</body>
</html>
