<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恒星语者 (Star Whisperer)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: #00001a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #gameCanvas {
            border: 2px solid #2d4b73;
            background: #000010;
            max-width: 100%;
            max-height: 80vh;
        }
        
        .ui-panel {
            width: 800px;
            max-width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a8d8ff;
            margin-top: 10px;
        }
        
        .status-box {
            background: rgba(10, 20, 50, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #4a80b4;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            background: rgba(30, 60, 100, 0.9);
            color: #a8d8ff;
            border: 1px solid #4a80b4;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: rgba(50, 90, 150, 0.9);
            border-color: #7ab0e8;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .neuro-link-meter {
            width: 200px;
            height: 20px;
            background: rgba(10, 20, 50, 0.8);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ffcc00, #4dff4d);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .message-box {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 20, 0.9);
            color: #a8d8ff;
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #4a80b4;
            max-width: 80%;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .message-box.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="message-box" id="messageBox">正在尝试建立神经链接...</div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div class="ui-panel">
        <div class="status-box">
            <div>神经链接强度: <span id="linkStrength">0%</span></div>
            <div class="neuro-link-meter">
                <div class="meter-fill" id="meterFill"></div>
            </div>
        </div>
        <div class="controls">
            <button id="connectBtn">建立神经链接</button>
            <button id="flareBtn" disabled>触发耀斑活动</button>
            <button id="spectrumBtn" disabled>调整光谱输出</button>
        </div>
    </div>

    <script>
        // 核心游戏对象
        const game = {
            canvas: document.getElementById('gameCanvas'),
            ctx: null,
            width: 800,
            height: 600,
            star: {
                x: 400,
                y: 300,
                radius: 150,
                coreColor: '#ffcc00',
                outerColor: '#ff6600',
                pulseSpeed: 0.02,
                pulseAmplitude: 10,
                currentPulse: 0,
                flareActive: false,
                flareIntensity: 0,
                spectrumShift: 0, // 0=默认, 1=偏蓝, -1=偏红
                magneticFieldLines: []
            },
            neuroLinkStrength: 0,
            isLinked: false,
            particles: [],
            messageBox: document.getElementById('messageBox'),
            
            // 初始化游戏
            init() {
                this.ctx = this.canvas.getContext('2d');
                this.generateMagneticFieldLines();
                this.bindEvents();
                this.animate();
            },
            
            // 生成恒星磁场线
            generateMagneticFieldLines() {
                this.star.magneticFieldLines = [];
                for (let i = 0; i < 30; i++) {
                    this.star.magneticFieldLines.push({
                        angle: Math.random() * Math.PI * 2,
                        thickness: Math.random() * 2 + 1,
                        length: Math.random() * 100 + 50,
                        speed: Math.random() * 0.01 + 0.005
                    });
                }
            },
            
            // 绑定交互事件
            bindEvents() {
                // 建立神经链接
                document.getElementById('connectBtn').addEventListener('click', () => {
                    this.showMessage('神经链接建立中...请保持专注');
                    const connectInterval = setInterval(() => {
                        this.neuroLinkStrength += 5;
                        this.updateLinkUI();
                        
                        if (this.neuroLinkStrength >= 100) {
                            clearInterval(connectInterval);
                            this.isLinked = true;
                            this.neuroLinkStrength = 100;
                            this.updateLinkUI();
                            this.showMessage('神经链接已建立！现在你可以与恒星沟通');
                            document.getElementById('flareBtn').disabled = false;
                            document.getElementById('spectrumBtn').disabled = false;
                            document.getElementById('connectBtn').disabled = true;
                        }
                    }, 200);
                });
                
                // 触发耀斑
                document.getElementById('flareBtn').addEventListener('click', () => {
                    if (!this.isLinked) return;
                    this.showMessage('请求恒星调整耀斑活动...');
                    this.star.flareActive = true;
                    this.star.flareIntensity = 1;
                    
                    // 耀斑衰减
                    setTimeout(() => {
                        const flareFade = setInterval(() => {
                            this.star.flareIntensity -= 0.05;
                            if (this.star.flareIntensity <= 0) {
                                clearInterval(flareFade);
                                this.star.flareActive = false;
                                this.star.flareIntensity = 0;
                                this.showMessage('耀斑活动已稳定，恒星回应了你的请求');
                            }
                        }, 100);
                    }, 1500);
                    
                    // 生成耀斑粒子
                    this.spawnFlareParticles();
                });
                
                // 调整光谱
                document.getElementById('spectrumBtn').addEventListener('click', () => {
                    if (!this.isLinked) return;
                    this.star.spectrumShift = (this.star.spectrumShift + 1) % 3 - 1; // 循环: -1(红) → 0(默认) → 1(蓝)
                    
                    const spectrumMsg = {
                        '-1': '请求恒星调整光谱至红色波段...',
                        '0': '请求恒星恢复默认光谱输出...',
                        '1': '请求恒星调整光谱至蓝色波段...'
                    };
                    this.showMessage(spectrumMsg[this.star.spectrumShift]);
                    
                    // 更新恒星颜色
                    if (this.star.spectrumShift === 1) {
                        this.star.coreColor = '#00ccff';
                        this.star.outerColor = '#0066ff';
                    } else if (this.star.spectrumShift === -1) {
                        this.star.coreColor = '#ff3300';
                        this.star.outerColor = '#990000';
                    } else {
                        this.star.coreColor = '#ffcc00';
                        this.star.outerColor = '#ff6600';
                    }
                });
                
                // 鼠标交互（增强沉浸感）
                this.canvas.addEventListener('mousemove', (e) => {
                    if (!this.isLinked) return;
                    const rect = this.canvas.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    
                    // 恒星跟随鼠标轻微移动（模拟神经感应）
                    this.star.x += (mouseX - this.star.x) * 0.01;
                    this.star.y += (mouseY - this.star.y) * 0.01;
                });
            },
            
            // 更新链接UI
            updateLinkUI() {
                document.getElementById('linkStrength').textContent = `${this.neuroLinkStrength}%`;
                document.getElementById('meterFill').style.width = `${this.neuroLinkStrength}%`;
            },
            
            // 显示提示信息
            showMessage(text) {
                this.messageBox.textContent = text;
                this.messageBox.classList.add('show');
                setTimeout(() => {
                    this.messageBox.classList.remove('show');
                }, 3000);
            },
            
            // 生成耀斑粒子
            spawnFlareParticles() {
                for (let i = 0; i < 200; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const distance = this.star.radius + Math.random() * 100;
                    this.particles.push({
                        x: this.star.x + Math.cos(angle) * distance,
                        y: this.star.y + Math.sin(angle) * distance,
                        vx: Math.cos(angle) * (Math.random() * 5 + 2),
                        vy: Math.sin(angle) * (Math.random() * 5 + 2),
                        size: Math.random() * 8 + 2,
                        alpha: 1,
                        color: this.star.coreColor
                    });
                }
            },
            
            // 绘制恒星
            drawStar() {
                const { ctx, star } = this;
                const currentRadius = star.radius + Math.sin(star.currentPulse) * star.pulseAmplitude;
                
                // 绘制恒星核心
                const coreGradient = ctx.createRadialGradient(
                    star.x, star.y, 0,
                    star.x, star.y, currentRadius
                );
                coreGradient.addColorStop(0, star.coreColor);
                coreGradient.addColorStop(1, star.outerColor);
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = coreGradient;
                ctx.fill();
                
                // 绘制耀斑效果
                if (star.flareActive) {
                    const flareRadius = currentRadius + star.flareIntensity * 50;
                    const flareGradient = ctx.createRadialGradient(
                        star.x, star.y, 0,
                        star.x, star.y, flareRadius
                    );
                    flareGradient.addColorStop(0, 'rgba(255, 255, 255, 0)');
                    flareGradient.addColorStop(0.7, 'rgba(255, 200, 0, 0.8)');
                    flareGradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
                    
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, flareRadius, 0, Math.PI * 2);
                    ctx.fillStyle = flareGradient;
                    ctx.fill();
                }
                
                // 绘制磁场线
                ctx.strokeStyle = 'rgba(168, 216, 255, 0.5)';
                star.magneticFieldLines.forEach(line => {
                    line.angle += line.speed * this.neuroLinkStrength / 100;
                    const startX = star.x + Math.cos(line.angle) * currentRadius;
                    const startY = star.y + Math.sin(line.angle) * currentRadius;
                    const endX = star.x + Math.cos(line.angle) * (currentRadius + line.length);
                    const endY = star.y + Math.sin(line.angle) * (currentRadius + line.length);
                    
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.lineWidth = line.thickness;
                    ctx.stroke();
                });
                
                // 更新脉冲
                star.currentPulse += star.pulseSpeed * (1 + this.neuroLinkStrength / 100);
            },
            
            // 绘制粒子
            drawParticles() {
                const { ctx } = this;
                
                // 更新并绘制粒子
                this.particles = this.particles.filter(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.alpha -= 0.01;
                    particle.size *= 0.98;
                    
                    if (particle.alpha <= 0 || particle.size <= 0) return false;
                    
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${parseInt(particle.color.slice(1,3),16)}, ${parseInt(particle.color.slice(3,5),16)}, ${parseInt(particle.color.slice(5,7),16)}, ${particle.alpha})`;
                    ctx.fill();
                    
                    return true;
                });
            },
            
            // 游戏主循环
            animate() {
                // 清空画布
                this.ctx.fillStyle = 'rgba(0, 0, 16, 0.1)';
                this.ctx.fillRect(0, 0, this.width, this.height);
                
                // 绘制游戏元素
                this.drawStar();
                this.drawParticles();
                
                // 持续动画
                requestAnimationFrame(() => this.animate());
            }
        };

        // 启动游戏
        window.addEventListener('load', () => {
            game.init();
        });
    </script>
</body>
</html>
