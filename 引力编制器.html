<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引力编织器 (Gravitic Loom)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: #0a0a1a;
            overflow: hidden;
            color: #ffffff;
        }

        /* 游戏容器 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a3a 0%, #050510 100%);
        }

        /* 引力波网格（编织基础） */
        #gravitic-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 编织结构显示区 */
        #structure-preview {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
        }

        /* 结构强度指示器 */
        #strength-meter {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 30px;
            border: 2px solid #4fc3f7;
            border-radius: 15px;
            overflow: hidden;
            z-index: 3;
        }

        #strength-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00e5ff, #2979ff);
            transition: width 0.5s ease;
        }

        /* 控制面板 */
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 30, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4fc3f7;
            z-index: 4;
        }

        .control-btn {
            background: #1a237e;
            color: #ffffff;
            border: 1px solid #4fc3f7;
            padding: 8px 15px;
            border-radius: 5px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block; /* 修复按钮排版问题 */
            width: 100%; /* 按钮宽度统一 */
        }

        .control-btn:hover {
            background: #283593;
            box-shadow: 0 0 10px #4fc3f7;
        }

        /* 信息显示 */
        #game-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 30, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #4fc3f7;
            z-index: 4;
            min-width: 200px;
        }

        /* 提示框（替代alert） */
        #custom-alert {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 30, 0.95);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #4fc3f7;
            z-index: 100;
            display: none;
            min-width: 300px;
            text-align: center;
        }

        #alert-close {
            margin-top: 15px;
            padding: 5px 15px;
            background: #1a237e;
            color: white;
            border: 1px solid #4fc3f7;
            border-radius: 5px;
            cursor: pointer;
        }

        /* 引力波粒子效果 */
        .gravitic-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #4fc3f7;
            border-radius: 50%;
            pointer-events: none;
            animation: particle-float 3s infinite ease-in-out;
        }

        @keyframes particle-float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
            50% { transform: translateY(-10px) scale(1.2); opacity: 1; }
        }

        /* 结构完成提示 */
        #completion-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 30, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #00e5ff;
            text-align: center;
            z-index: 10;
            display: none;
            box-shadow: 0 0 30px #00e5ff;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 自定义提示框 -->
        <div id="custom-alert">
            <p id="alert-text"></p>
            <button id="alert-close">确定</button>
        </div>
        
        <!-- 引力波网格画布 -->
        <canvas id="gravitic-grid"></canvas>
        
        <!-- 结构预览区 -->
        <div id="structure-preview">
            <h2 id="current-structure">未选择结构</h2>
            <p>编织进度: <span id="weave-progress">0%</span></p>
        </div>

        <!-- 强度指示器 -->
        <div id="strength-meter">
            <div id="strength-bar"></div>
        </div>

        <!-- 控制面板 -->
        <div id="control-panel">
            <h3>引力编织控制台</h3>
            <button class="control-btn" id="btn-bridge">编织桥梁</button>
            <button class="control-btn" id="btn-building">编织建筑</button>
            <button class="control-btn" id="btn-ring">编织行星环</button>
            <button class="control-btn" id="btn-reset">重置编织</button>
        </div>

        <!-- 游戏信息 -->
        <div id="game-info">
            <h3>引力编织器状态</h3>
            <p>结构类型: <span id="structure-type">无</span></p>
            <p>结构强度: <span id="structure-strength">0/100</span></p>
            <p>高维空间稳定性: <span id="space-stability">98%</span></p>
        </div>

        <!-- 完成提示 -->
        <div id="completion-alert">
            <h2>✨ 引力结构编织完成!</h2>
            <p id="alert-message"></p>
            <button class="control-btn" id="btn-continue" style="margin-top: 20px;">继续编织</button>
        </div>
    </div>

    <script>
        // 游戏核心变量
        const game = {
            currentStructure: null, // 当前编织的结构
            weaveProgress: 0,       // 编织进度
            strength: 0,            // 结构强度
            grid: null,             // 画布上下文
            gridWidth: window.innerWidth,
            gridHeight: window.innerHeight,
            particles: [],          // 引力波粒子数组
            maxParticles: 200,      // 最大粒子数
            isWeaving: false        // 是否正在编织
        };

        // 初始化游戏
        function initGame() {
            // 初始化画布
            const canvas = document.getElementById('gravitic-grid');
            canvas.width = game.gridWidth;
            canvas.height = game.gridHeight;
            game.grid = canvas.getContext('2d');

            // 绑定按钮事件（修复事件绑定逻辑）
            document.getElementById('btn-bridge').addEventListener('click', () => selectStructure('bridge'));
            document.getElementById('btn-building').addEventListener('click', () => selectStructure('building'));
            document.getElementById('btn-ring').addEventListener('click', () => selectStructure('ring'));
            document.getElementById('btn-reset').addEventListener('click', resetWeaving);
            document.getElementById('btn-continue').addEventListener('click', hideCompletionAlert);
            document.getElementById('alert-close').addEventListener('click', hideCustomAlert);

            // 绑定鼠标/触摸事件（修复交互逻辑）
            document.getElementById('game-container').addEventListener('mousedown', (e) => {
                // 排除点击按钮区域
                if (!e.target.closest('.control-btn') && !e.target.closest('#custom-alert') && !e.target.closest('#completion-alert')) {
                    startWeaving();
                }
            });
            document.addEventListener('mouseup', stopWeaving); // 全局监听鼠标松开
            document.getElementById('game-container').addEventListener('mousemove', createGraviticParticle);

            // 开始游戏循环
            gameLoop();
        }

        // 显示自定义提示框（替代alert，避免阻塞）
        function showCustomAlert(message) {
            document.getElementById('alert-text').textContent = message;
            document.getElementById('custom-alert').style.display = 'block';
        }

        // 隐藏自定义提示框
        function hideCustomAlert() {
            document.getElementById('custom-alert').style.display = 'none';
        }

        // 选择要编织的结构（修复核心逻辑）
        function selectStructure(type) {
            // 重置之前的状态
            game.isWeaving = false;
            game.weaveProgress = 0;
            game.strength = 0;
            
            // 设置当前结构
            game.currentStructure = type;

            // 更新UI显示
            const structureNames = {
                bridge: '引力桥梁',
                building: '引力建筑',
                ring: '行星环'
            };
            
            document.getElementById('current-structure').textContent = structureNames[type];
            document.getElementById('structure-type').textContent = structureNames[type];
            document.getElementById('weave-progress').textContent = '0%';
            document.getElementById('structure-strength').textContent = '0/100';
            document.getElementById('strength-bar').style.width = '0%';

            // 显示自定义提示（替代alert）
            showCustomAlert(`开始编织${structureNames[type]}! 按住鼠标左键在屏幕上移动来编织引力波。`);
        }

        // 开始编织（按住鼠标）
        function startWeaving() {
            if (!game.currentStructure) {
                showCustomAlert('请先选择要编织的结构类型!');
                return;
            }
            game.isWeaving = true;
        }

        // 停止编织（松开鼠标）
        function stopWeaving() {
            game.isWeaving = false;
        }

        // 创建引力波粒子（修复触发条件）
        function createGraviticParticle(e) {
            // 严格判断：必须选中结构且正在编织中
            if (!game.isWeaving || !game.currentStructure) return;

            // 增加编织进度（优化增长速度）
            game.weaveProgress = Math.min(game.weaveProgress + 0.2, 100);
            game.strength = Math.floor(game.weaveProgress * (game.currentStructure === 'ring' ? 1.2 : 1)); // 行星环强度更高
            game.strength = Math.min(game.strength, 100);

            // 更新进度显示
            document.getElementById('weave-progress').textContent = `${game.weaveProgress.toFixed(1)}%`;
            document.getElementById('structure-strength').textContent = `${game.strength}/100`;
            document.getElementById('strength-bar').style.width = `${game.weaveProgress}%`;

            // 创建粒子效果
            if (game.particles.length < game.maxParticles) {
                const particle = document.createElement('div');
                particle.className = 'gravitic-particle';
                particle.style.left = `${e.clientX}px`;
                particle.style.top = `${e.clientY}px`;
                particle.style.animationDelay = `${Math.random() * 3}s`;
                
                document.getElementById('game-container').appendChild(particle);
                game.particles.push(particle);

                // 粒子生命周期
                setTimeout(() => {
                    particle.style.opacity = '0';
                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                            const index = game.particles.indexOf(particle);
                            if (index > -1) game.particles.splice(index, 1);
                        }
                    }, 3000);
                }, 3000);
            }

            // 检查是否编织完成
            if (game.weaveProgress >= 100 && document.getElementById('completion-alert').style.display === 'none') {
                completeWeaving();
            }
        }

        // 完成编织
        function completeWeaving() {
            game.isWeaving = false;
            
            // 显示完成提示
            const alertEl = document.getElementById('completion-alert');
            const alertMsg = document.getElementById('alert-message');
            
            const strengthMessages = {
                bridge: `引力桥梁编织完成! 结构强度: ${game.strength}/100 (超越原子键合强度)`,
                building: `引力建筑编织完成! 结构强度: ${game.strength}/100 (可抵御行星级冲击)`,
                ring: `行星环编织完成! 结构强度: ${game.strength}/100 (可环绕小型行星)`
            };
            
            alertMsg.textContent = strengthMessages[game.currentStructure];
            alertEl.style.display = 'block';

            // 更新空间稳定性（高强度会略微降低稳定性）
            const stability = Math.max(90 - (100 - game.strength) / 10, 80);
            document.getElementById('space-stability').textContent = `${stability}%`;
        }

        // 隐藏完成提示
        function hideCompletionAlert() {
            document.getElementById('completion-alert').style.display = 'none';
            resetWeaving();
        }

        // 重置编织
        function resetWeaving() {
            game.currentStructure = null;
            game.weaveProgress = 0;
            game.strength = 0;
            game.isWeaving = false;

            // 清空粒子
            game.particles.forEach(particle => {
                if (particle.parentNode) particle.parentNode.removeChild(particle);
            });
            game.particles = [];

            // 重置UI
            document.getElementById('current-structure').textContent = '未选择结构';
            document.getElementById('weave-progress').textContent = '0%';
            document.getElementById('structure-type').textContent = '无';
            document.getElementById('structure-strength').textContent = '0/100';
            document.getElementById('strength-bar').style.width = '0%';
            document.getElementById('space-stability').textContent = '98%';
        }

        // 绘制引力波网格
        function drawGraviticGrid() {
            if (!game.grid) return;

            // 清空画布
            game.grid.clearRect(0, 0, game.gridWidth, game.gridHeight);

            // 设置网格样式（引力波效果）
            game.grid.strokeStyle = 'rgba(79, 195, 247, 0.2)';
            game.grid.lineWidth = 1;

            // 绘制横向网格线
            const gridStep = 50; // 网格间距
            for (let y = 0; y < game.gridHeight; y += gridStep) {
                game.grid.beginPath();
                game.grid.moveTo(0, y);
                game.grid.lineTo(game.gridWidth, y);
                game.grid.stroke();
            }

            // 绘制纵向网格线
            for (let x = 0; x < game.gridWidth; x += gridStep) {
                game.grid.beginPath();
                game.grid.moveTo(x, 0);
                game.grid.lineTo(x, game.gridHeight);
                game.grid.stroke();
            }

            // 如果正在编织，绘制动态引力波
            if (game.isWeaving && game.weaveProgress > 0) {
                game.grid.strokeStyle = 'rgba(79, 195, 247, 0.8)';
                game.grid.lineWidth = 2;
                
                // 绘制波浪形引力波
                game.grid.beginPath();
                const waveY = game.gridHeight / 2;
                const waveAmplitude = 50 * (game.weaveProgress / 100);
                
                for (let x = 0; x < game.gridWidth; x++) {
                    const y = waveY + Math.sin(x / 50 + Date.now() / 500) * waveAmplitude;
                    if (x === 0) game.grid.moveTo(x, y);
                    else game.grid.lineTo(x, y);
                }
                game.grid.stroke();
            }
        }

        // 游戏主循环
        function gameLoop() {
            drawGraviticGrid();
            requestAnimationFrame(gameLoop);
        }

        // 窗口大小适配
        window.addEventListener('resize', () => {
            game.gridWidth = window.innerWidth;
            game.gridHeight = window.innerHeight;
            
            const canvas = document.getElementById('gravitic-grid');
            canvas.width = game.gridWidth;
            canvas.height = game.gridHeight;
        });

        // 启动游戏
        window.onload = initGame;
    </script>
</body>
</html>
